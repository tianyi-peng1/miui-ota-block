name: Build and Release

on:
  # 手动触发：在 Actions 页面点 Run workflow 即可出包
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号，例如 v1.1'
        required: true
        default: 'v1.1'
  # 打 tag 时自动触发
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from module.prop
        id: ver
        run: |
          VERSION=$(grep -E '^version=' module.prop | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package module
        run: |
          zip -r "miui-ota-block-${{ steps.ver.outputs.version }}.zip" \
            module.prop post-fs-data.sh system META-INF
          unzip -l "miui-ota-block-${{ steps.ver.outputs.version }}.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.ver.outputs.version }}
          files: miui-ota-block-*.zip
          generate_release_notes: true
